name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Triggers release flow when you push a tag like v1.0.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Add this line for manual triggering of the workflow

permissions:
    contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
        }
      shell: pwsh
    
    - name: Configure CMake
      run: |
        cmake -B build -S . "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows-static
      shell: pwsh
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual
        queries: security-extended

    - name: Build Project
      run: cmake --build build --config Release
      shell: pwsh
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StockMonitor-Windows
        path: build/Release/StockMonitor.exe

  create-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: StockMonitor-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StockMonitor.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  repo-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy results to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
  
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stock-monitor-cpp .

      - name: "Smoke test: binary present and executable"
        run: docker run --rm stock-monitor-cpp test -x /usr/local/bin/StockMonitor

      - name: "Smoke test: no missing libraries"
        run: |
          docker run --rm stock-monitor-cpp ldd /usr/local/bin/StockMonitor
          if docker run --rm stock-monitor-cpp ldd /usr/local/bin/StockMonitor | grep -q "not found"; then
            echo "Missing libraries found"
            exit 1
          fi

      - name: "Smoke test: runs as non-root"
        run: |
          uid=$(docker run --rm stock-monitor-cpp id -u)
          echo "Container UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "Container runs as root"
            exit 1
          fi
      # ---------- NEU: #38 image scan----------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: stock-monitor-cpp
          scanners: vuln                                                              # 41
          skip-dirs: /opt/vcpkg/buildtrees,/opt/vcpkg/downloads,/opt/vcpkg/packages   # 41
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy image results to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy Image Scan (after, table only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: stock-monitor-cpp
          scanners: vuln
          skip-dirs: /opt/vcpkg/buildtrees,/opt/vcpkg/downloads,/opt/vcpkg/packages
          severity: CRITICAL,HIGH,MEDIUM,LOW
          format: table

      - name: Show image size
        run: docker images stock-monitor-cpp